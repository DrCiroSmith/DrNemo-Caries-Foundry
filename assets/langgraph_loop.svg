<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t4 d4">
  <title id="t4">Autonomous Biophysical Discovery &amp; Karl Popper Falsification Loop</title>
  <desc id="d4">CAHWRPWHC macrocycle discovery: Evolutionary Generator, Oral Shield Gate, 28.0 Å Dual Docking, OpenMM 310.15 K Relaxation, 6-Angle Popper Falsification, SQLite Vault &amp; SPPS — with falsification feedback arc.</desc>
  <style>
    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; rx: 12; ry: 12; }
    .txt-main { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .txt-sub { fill: var(--muted); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11; }
    .txt-mono { fill: var(--accent); font-family: 'Menlo', 'Consolas', monospace; font-size: 10; }
    .node { fill: var(--node); stroke: var(--node-border); stroke-width: 2; rx: 10; ry: 10; }
    .node.active { fill: var(--node-active); stroke: var(--node-active-border); stroke-width: 3; }
    .arrow { fill: none; stroke: var(--arrow); stroke-width: 2.5; marker-end: url(#arrowhead); }
    .falsify { fill: none; stroke: var(--falsify); stroke-width: 3; stroke-dasharray: 7 5; marker-end: url(#falsifyhead); }
    @media (prefers-color-scheme: light) {
      :root { --bg:#F8FAFC; --panel:#FFFFFF; --border:#CBD5E1; --text:#0F172A; --muted:#475569; --accent:#0EA5E9; --node:#FFFFFF; --node-border:#94A3B8; --node-active:#10B981; --node-active-border:#047857; --arrow:#64748B; --falsify:#DC2626; }
    }
    :root { --bg:#0B1120; --panel:#111827; --border:#334155; --text:#F8FAFC; --muted:#94A3B8; --accent:#38BDF8; --node:#1F2937; --node-border:#475569; --node-active:#10B981; --node-active-border:#047857; --arrow:#475569; --falsify:#EF4444; }
  </style>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/>
  </marker>
  <marker id="falsifyhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
    <polygon points="0 0, 12 4, 0 8" fill="var(--falsify)"/>
  </marker>
  <rect class="bg" width="1200" height="480"/>
  <!-- Title -->
  <text x="24" y="40" class="txt-main" font-size="17">Autonomous Biophysical Discovery &amp; Karl Popper Falsification Loop</text>
