    <text x="12" y="48" class="txt-sub" font-size="10.5">Contender Vault</text>
    <text x="12" y="68" class="txt-mono">solid-phase synthesis</text>
    <text x="12" y="90" class="txt-sub" font-size="10">CAHWRPWHC corroborated</text>
  </g>
  <!-- Forward arrows -->
  <line x1="204" y1="64" x2="220" y2="64" class="arrow"/>
  <line x1="396" y1="64" x2="412" y2="64" class="arrow"/>
  <line x1="588" y1="64" x2="604" y2="64" class="arrow"/>
  <line x1="780" y1="64" x2="796" y2="64" class="arrow"/>
  <line x1="972" y1="64" x2="988" y2="64" class="arrow"/>
