    <text x="12" y="66" class="txt-sub" font-size="10.5">on 3AIC &amp; 1SMD</text>
    <text x="12" y="88" class="txt-mono">CAHWRPWHC: -8.191 / -4.990</text>
  </g>
  <g transform="translate(604, 96)">
    <rect class="node" x="0" y="0" width="176" height="128"/>
