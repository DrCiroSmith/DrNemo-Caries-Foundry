<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t2 d2">
  <title id="t2">S. MUTANS GtfB Catalytic Cleft Docking · 28.0 Å Uncompressed Grid</title>
  <desc id="d2">CAHWRPWHC macrocycle docked into RCSB 3AIC catalytic cleft (Asp477, Glu515, Asp588, Trp517). S-S 2.06 Å, Arg5-Pro6 shielded. Telemetry: Vina -8.191 kcal/mol, Vinardo -4.990, 1SMD ΔΔG -0.85 kcal/mol, OpenMM -1234.68 kJ/mol.</desc>
  <style>
    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; rx: 12; ry: 12; }
    .txt-main { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .txt-sub { fill: var(--muted); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11; }
    .txt-mono { fill: var(--accent); font-family: 'Menlo', 'Consolas', monospace; font-size: 10; }
    .pocket-surf { fill: var(--pocket); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .residue-dot { fill: var(--residue); }
    .hbond { stroke: var(--bond); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .peptide-cycle { fill: var(--peptide); fill-opacity: 0.25; stroke: var(--accent); stroke-width: 2.5; }
    .ss-bond { stroke: var(--ss); stroke-width: 3.5; stroke-linecap: round; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#F8FAFC; --panel:#FFFFFF; --border:#CBD5E1; --text:#0F172A; --muted:#475569; --accent:#0EA5E9; --pocket:#E0F2FE; --residue:#F59E0B; --bond:#10B981; --peptide:#0EA5E9; --ss:#F59E0B; }
    }
    :root { --bg:#0B1120; --panel:#111827; --border:#334155; --text:#F8FAFC; --muted:#94A3B8; --accent:#38BDF8; --pocket:#1E293B; --residue:#F59E0B; --bond:#10B981; --peptide:#06B6D4; --ss:#F59E0B; }
  </style>
  <rect class="bg" width="1200" height="480"/>
  <!-- Header -->
  <g transform="translate(24, 34)">
    <text x="0" y="26" class="txt-main" font-size="17">S. MUTANS GtfB CATALYTIC CLEFT DOCKING • 28.0 Å UNCOMPRESSED GRID</text>
    <text x="0" y="50" class="txt-sub">RCSB 3AIC: Asp477 • Glu515 • Asp588 • Trp517 • Macrocycle CAHWRPWHC (S-S 2.06 Å, Arg5-Pro6 shielded)</text>
  </g>
  <!-- Left: Pocket view -->
  <g transform="translate(24, 86)">
    <rect class="panel" width="580" height="350"/>
    <text x="22" y="30" class="txt-main" font-size="13">Active Pocket (3AIC)</text>
    <path d="M 70 90 C 130 50, 250 60, 310 120 C 370 180, 470 160, 490 250 C 510 340, 390 350, 310 330 C 230 310, 140 350, 80 290 C 20 230, 10 130, 70 90 Z" class="pocket-surf"/>
    <g transform="translate(170, 150)">
      <circle cx="0" cy="0" r="6" class="residue-dot"/>
      <text x="14" y="6" class="txt-mono" font-size="11" font-weight="700">Asp477</text>
    </g>
    <g transform="translate(400, 180)">
      <circle cx="0" cy="0" r="6" class="residue-dot"/>
      <text x="14" y="6" class="txt-mono" font-size="11" font-weight="700">Glu515</text>
    </g>
    <g transform="translate(280, 300)">
      <circle cx="0" cy="0" r="6" class="residue-dot"/>
      <text x="14" y="6" class="txt-mono" font-size="11" font-weight="700">Asp588</text>
    </g>
    <g transform="translate(360, 250)">
      <circle cx="0" cy="0" r="6" class="residue-dot"/>
      <text x="14" y="6" class="txt-mono" font-size="11" font-weight="700">Trp517</text>
    </g>
    <line x1="290" y1="220" x2="170" y2="150" class="hbond"/>
    <line x1="310" y1="220" x2="400" y2="180" class="hbond"/>
    <line x1="300" y1="230" x2="280" y2="300" class="hbond"/>
    <circle cx="300" cy="220" r="30" fill="none" stroke="var(--bond)" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="26;36;26" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="326" class="txt-sub">Macrocycle CAHWRPWHC • S-S 2.06 Å • Arg5-Pro6 shielded</text>
  </g>
  <!-- Right: Telemetry cards -->
  <g transform="translate(634, 86)">
    <rect class="panel" width="542" height="350"/>
    <text x="22" y="30" class="txt-main" font-size="13">Telemetry — 330fb5d Physics</text>
    <g transform="translate(22, 52)">
      <rect width="245" height="78" rx="8" class="panel"/>
      <text x="16" y="26" class="txt-sub" font-size="10.5">AutoDock Vina ΔG</text>
      <text x="16" y="46" class="txt-mono" font-size="15" font-weight="700">-8.191 kcal/mol</text>
      <text x="16" y="66" class="txt-sub" font-size="9.5">3AIC catalytic cleft</text>
    </g>
    <g transform="translate(287, 52)">
      <rect width="245" height="78" rx="8" class="panel"/>
      <text x="16" y="26" class="txt-sub" font-size="10.5">Vinardo ΔG</text>
      <text x="16" y="46" class="txt-mono" font-size="15" font-weight="700">-4.990 kcal/mol</text>
      <text x="16" y="66" class="txt-sub" font-size="9.5">empirical cross-check</text>
    </g>
    <g transform="translate(22, 146)">
      <rect width="245" height="78" rx="8" class="panel"/>
      <text x="16" y="26" class="txt-sub" font-size="10.5">1SMD ΔΔG (amylase)</text>
      <text x="16" y="46" class="txt-mono" font-size="15" font-weight="700">-0.85 kcal/mol</text>
      <text x="16" y="66" class="txt-sub" font-size="9.5">host off-target counter-screen</text>
    </g>
    <g transform="translate(287, 146)">
      <rect width="245" height="78" rx="8" class="panel"/>
      <text x="16" y="26" class="txt-sub" font-size="10.5">OpenMM Amber14/GBn2</text>
      <text x="16" y="46" class="txt-mono" font-size="15" font-weight="700">-1234.68 kJ/mol</text>
      <text x="16" y="66" class="txt-sub" font-size="9.5">310.15 K relaxed</text>
    </g>
    <g transform="translate(22, 240)">
      <rect width="498" height="86" rx="8" class="panel"/>
      <text x="16" y="30" class="txt-sub" font-size="10.5">Macrocycle geometry</text>
      <text x="16" y="50" class="txt-mono" font-size="12" font-weight="700">CAHWRPWHC • cyclic disulfide • S-S 2.06 Å</text>
      <text x="16" y="70" class="txt-sub" font-size="10.5">Arg5-Pro6 shielded • 0 protease sites • Donnan Q +2.046</text>
    </g>
  </g>
  <text x="24" y="458" class="txt-sub" font-size="10">Light/Dark • Zero text collisions • 100% 330fb5d physics</text>
</svg>
