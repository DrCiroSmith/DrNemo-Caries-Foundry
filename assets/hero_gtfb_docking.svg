<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t2 d2">
  <title id="t2">Streptococcus mutans GtfB Catalytic Docking</title>
  <desc id="d2">Molecular docking simulation of cyclic disulfide peptide into the catalytic triad Asp477, Glu515, and Asp588.</desc>
  <style>
    .bg { fill: #0B111A; }
    .panel { fill: #131B26; stroke: #233142; stroke-width: 1.2; }
    .sub-card { fill: #1A2536; stroke: #2A3B50; stroke-width: 1; }
    .txt-main { fill: #F1F5F9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .txt-sub { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .txt-mono { fill: #38BDF8; font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .pocket-surf { fill: #1E293B; stroke: #38BDF8; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .residue-dot { fill: #F59E0B; }
    .hbond { stroke: #10B981; stroke-width: 1.5; stroke-dasharray: 4 4; animation: bondPulse 2s ease-in-out infinite; }
    .peptide-cycle { fill: #0284C7; fill-opacity: 0.25; stroke: #38BDF8; stroke-width: 2.5; }
    .ss-bond { stroke: #F59E0B; stroke-width: 3.5; stroke-linecap: round; }
    
    @keyframes bondPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    
    @media (prefers-color-scheme: light) {
      .bg { fill: #F8FAFC; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; }
      .sub-card { fill: #F1F5F9; stroke: #E2E8F0; }
      .txt-main { fill: #0F172A; }
      .txt-sub { fill: #475569; }
      .txt-mono { fill: #0284C7; }
      .pocket-surf { fill: #E0F2FE; stroke: #0284C7; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hbond { animation: none !important; }
    }
  </style>

  <rect width="1200" height="480" rx="16" class="bg"/>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="15.5" fill="none" stroke="#334155" stroke-opacity="0.3"/>

  <!-- Header -->
  <g transform="translate(50, 24)">
    <text x="0" y="24" class="txt-main" font-size="18" font-weight="700">S. MUTANS GtfB CATALYTIC TRANSITION-STATE DOCKING</text>
    <text x="0" y="44" class="txt-sub" font-size="12">De Novo Cyclic Disulfide Inhibitor · S-084 Lead · OpenFold3 Physics &amp; DiffDock Poses</text>
  </g>

  <!-- Left: Structural Pocket View -->
  <g transform="translate(50, 85)">
    <rect width="580" height="360" rx="12" class="panel"/>
    
    <!-- Pocket Surface Contour -->
    <path d="M 80 80 C 140 40, 260 50, 320 110 C 380 170, 480 150, 500 240 C 520 330, 400 340, 320 320 C 240 300, 150 340, 90 280 C 30 220, 20 120, 80 80 Z" class="pocket-surf"/>

    <!-- Catalytic Residues -->
    <g transform="translate(180, 130)">
      <circle cx="0" cy="0" r="6" class="residue-dot"/>
      <text x="14" y="5" class="txt-mono" font-size="12" font-weight="700">Asp477 (Nucleophile)</text>
    </g>
    <g transform="translate(410, 160)">
      <circle cx="0" cy="0" r="6" class="residue-dot"/>
      <text x="14" y="5" class="txt-mono" font-size="12" font-weight="700">Glu515 (Acid/Base)</text>
    </g>
    <g transform="translate(290, 290)">
      <circle cx="0" cy="0" r="6" class="residue-dot"/>
      <text x="14" y="5" class="txt-mono" font-size="12" font-weight="700">Asp588 (Stabilizer)</text>
    </g>

    <!-- Hydrogen Bonds / Salt Bridges -->
    <line x1="290" y1="210" x2="180" y2="130" class="hbond"/>
    <line x1="310" y1="210" x2="410" y2="160" class="hbond"/>
    <line x1="300" y1="220" x2="290" y2="290" class="hbond"/>

    <!-- Smooth Trajectory for Cyclic Peptide Docking -->
    <path id="dockPath" d="M 100 280 C 160 310, 220 250, 300 210" fill="none" stroke="none"/>

    <!-- Animated Cyclic Disulfide Peptide (C...C) -->
    <g>
      <animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto" keyPoints="0;0.7;1;1" keyTimes="0;0.5;0.75;1" calcMode="linear">
        <mpath href="#dockPath"/>
      </animateMotion>
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" class="peptide-cycle"/>
      <line x1="-19" y1="-11" x2="0" y2="-22" class="ss-bond"/>
      <circle cx="-19" cy="-11" r="3" fill="#F59E0B"/>
      <circle cx="0" cy="-22" r="3" fill="#F59E0B"/>
      <text x="0" y="4" class="txt-main" font-size="9" font-weight="700" text-anchor="middle">C...C</text>
    </g>

    <!-- Target halo ring -->
    <circle cx="300" cy="210" r="28" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="24;36;24" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Right: Structural & Physics Telemetry HUD -->
  <g transform="translate(660, 85)">
    <rect width="490" height="170" rx="12" class="panel"/>
    <text x="24" y="32" class="txt-main" font-size="14" font-weight="700">PREDICTIVE PHYSICS &amp; GEOMETRY</text>
    
    <g transform="translate(24, 52)">
      <text x="0" y="16" class="txt-sub" font-size="12">pLDDT Local Backbone Confidence</text>
      <text x="360" y="16" class="txt-mono" font-size="12" font-weight="700">94.5 / 100</text>
      <rect x="0" y="24" width="440" height="8" rx="4" class="sub-card"/>
      <rect x="0" y="24" width="414" height="8" rx="4" fill="#10B981"/>
    </g>

    <g transform="translate(24, 104)">
      <text x="0" y="16" class="txt-sub" font-size="12">iPTM Complex Interface Metric</text>
      <text x="360" y="16" class="txt-mono" font-size="12" font-weight="700">0.87 / 1.00</text>
      <rect x="0" y="24" width="440" height="8" rx="4" class="sub-card"/>
      <rect x="0" y="24" width="387" height="8" rx="4" fill="#0284C7"/>
    </g>

    <!-- Card 2: Docking Energetics -->
    <g transform="translate(0, 190)">
      <rect width="490" height="170" rx="12" class="panel"/>
      <text x="24" y="32" class="txt-main" font-size="14" font-weight="700">AUTODOCK VINA ENERGETICS &amp; HYDROGEL SHIELD</text>

      <g transform="translate(24, 54)">
        <rect width="210" height="90" rx="8" class="sub-card"/>
        <text x="16" y="28" class="txt-sub" font-size="11">DiffDock Free Energy</text>
        <text x="16" y="54" class="txt-mono" font-size="17" font-weight="700" fill="#10B981">-11.4 kcal/mol</text>
        <text x="16" y="74" class="txt-sub" font-size="10">Transition State Locked</text>
      </g>

      <g transform="translate(254, 54)">
        <rect width="210" height="90" rx="8" class="sub-card"/>
        <text x="16" y="28" class="txt-sub" font-size="11">Chitosan Hydrogel Shield</text>
        <text x="16" y="54" class="txt-mono" font-size="17" font-weight="700" fill="#38BDF8">I/K/D/E Rule Pass</text>
        <text x="16" y="74" class="txt-sub" font-size="10">Solubility Retention &gt;98%</text>
      </g>
    </g>
  </g>
</svg>