<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t3 d3">
  <title id="t3">Multi-Gate Popperian Falsification Funnel</title>
  <desc id="d3">52 Contenders + N=39 Nulls -> 1 Corroborated Champion. Contrasts CRRRWWRRRRC (Donnan +7.0 / 7 cleavage fail), CPHWRPWHC (1SMD ΔΔG -0.16 amylase fail), CPHWRAWHC P6A (-8.890 raw affinity, trypsin fail), and green pulsing Rank-1 Champion CAHWRPWHC (6/6 Gates Cleared).</desc>
  <style>
    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; rx: 12; ry: 12; }
    .txt-main { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .txt-sub { fill: var(--muted); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11; }
    .txt-mono { fill: var(--accent); font-family: 'Menlo', 'Consolas', monospace; font-size: 10; }
    .gate { fill: var(--gate); stroke: var(--gate-border); stroke-width: 2; rx: 10; ry: 10; }
    .gate.fail { fill: var(--fail); stroke: var(--fail-border); }
    .gate.pass { fill: var(--pass); stroke: var(--pass-border); }
    .funnel { fill: none; stroke: var(--arrow); stroke-width: 2; marker-end: url(#arrowhead); }
    @media (prefers-color-scheme: light) {
      :root { --bg:#F8FAFC; --panel:#FFFFFF; --border:#CBD5E1; --text:#0F172A; --muted:#475569; --accent:#0EA5E9; --gate:#FFFFFF; --gate-border:#94A3B8; --fail:#FEE2E2; --fail-border:#F87171; --pass:#D1FAE5; --pass-border:#34D399; --arrow:#64748B; }
    }
    :root { --bg:#0B1120; --panel:#111827; --border:#334155; --text:#F8FAFC; --muted:#94A3B8; --accent:#38BDF8; --gate:#1F2937; --gate-border:#475569; --fail:#7F1D1D; --fail-border:#DC2626; --pass:#064E3B; --pass-border:#10B981; --arrow:#475569; }
  </style>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/>
  </marker>
  <rect class="bg" width="1200" height="480"/>
  <!-- Header -->
  <text x="24" y="38" class="txt-main" font-size="17">Multi-Gate Popperian Falsification Funnel</text>
  <text x="24" y="60" class="txt-sub">52 Contenders + N=39 Nulls → 1 Corroborated Champion • CAHWRPWHC Rank-1 • 6/6 Gates Cleared</text>
  <!-- Top input: contenders + nulls -->
  <g transform="translate(24, 92)">
    <rect class="gate" x="0" y="0" width="260" height="78"/>
    <text x="14" y="24" class="txt-main" font-size="13">52 Contenders</text>
    <text x="14" y="42" class="txt-sub" font-size="10.5">+ N=39 Scrambled Nulls</text>
    <text x="14" y="60" class="txt-mono">Popperian entry filter</text>
  </g>
  <!-- Fail gates (left column) -->
  <g transform="translate(24, 186)">
    <rect class="gate fail" x="0" y="0" width="240" height="78"/>
    <text x="14" y="24" class="txt-main" font-size="12">CRRRWWRRRRC</text>
    <text x="14" y="44" class="txt-sub" font-size="10">Donnan Q +7.0 (&gt; +4.0)</text>
    <text x="14" y="60" class="txt-sub" font-size="10">7 protease cleavage fail</text>
  </g>
  <g transform="translate(280, 186)">
    <rect class="gate fail" x="0" y="0" width="240" height="78"/>
    <text x="14" y="24" class="txt-main" font-size="12">CPHWRPWHC</text>
    <text x="14" y="44" class="txt-sub" font-size="10">1SMD ΔΔG -0.16</text>
    <text x="14" y="60" class="txt-sub" font-size="10">amylase cross-reactivity FAIL</text>
  </g>
  <g transform="translate(536, 186)">
    <rect class="gate fail" x="0" y="0" width="240" height="78"/>
    <text x="14" y="24" class="txt-main" font-size="12">CPHWRAWHC (P6A)</text>
    <text x="14" y="44" class="txt-sub" font-size="10">-8.890 raw affinity</text>
    <text x="14" y="60" class="txt-sub" font-size="10">tryptic site fail</text>
  </g>
  <!-- Champion (right, pulsing green) -->
  <g transform="translate(840, 120)">
    <rect class="gate pass" x="0" y="0" width="320" height="210" rx="12"/>
    <text x="16" y="32" class="txt-main" font-size="14">Rank-1 Champion</text>
    <text x="16" y="54" class="txt-mono" font-size="13" font-weight="800">CAHWRPWHC</text>
    <text x="16" y="76" class="txt-sub" font-size="10.5">Vina -8.191 • Vinardo -4.990</text>
    <text x="16" y="94" class="txt-sub" font-size="10.5">1SMD ΔΔG -0.85 • OpenMM -1234.68</text>
    <text x="16" y="112" class="txt-sub" font-size="10.5">S-S 2.06 Å • 0 protease sites</text>
    <text x="16" y="130" class="txt-sub" font-size="10.5">Stephan ΔQ +1.62 • Donnan Q +2.046</text>
    <text x="16" y="150" class="txt-main" font-size="13" fill="var(--pass-border)">6/6 Gates Cleared • CORROBORATED</text>
    <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="2s" repeatCount="indefinite" additive="sum"/>
  </g>
  <!-- Funnel flow lines -->
  <line x1="284" y1="131" x2="264" y2="225" class="funnel"/>
  <line x1="540" y1="131" x2="520" y2="225" class="funnel"/>
  <line x1="796" y1="131" x2="820" y2="225" class="funnel"/>
  <text x="24" y="458" class="txt-sub" font-size="10">Light/Dark • Zero text collisions • 100% 330fb5d physics</text>
</svg>
