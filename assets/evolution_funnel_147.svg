    .sub-card { fill: #1A2536; stroke: #2A3B50; stroke-width: 1; }
    .txt-main { fill: #F1F5F9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .txt-sub { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .txt-mono { fill: #38BDF8; font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    
    .node-dim { fill: #EF4444; fill-opacity: 0.22; stroke: #EF4444; stroke-opacity: 0.4; }
    .node-viable { fill: #F59E0B; fill-opacity: 0.65; stroke: #F59E0B; animation: pulseViable 2s infinite alternate; }
    .node-lead { fill: #10B981; stroke: #34D399; stroke-width: 2.5; animation: pulseLead 1.5s infinite alternate; }
    
    @keyframes pulseViable { from { fill-opacity: 0.45; } to { fill-opacity: 0.9; } }
    @keyframes pulseLead { from { transform: scale(1); } to { transform: scale(1.12); } }

    @media (prefers-color-scheme: light) {
      .bg { fill: #F8FAFC; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; }
      .sub-card { fill: #F1F5F9; stroke: #E2E8F0; }
